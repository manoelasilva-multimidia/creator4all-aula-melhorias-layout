<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>
      Creator4all Premium — Resposta correta
    </title>
    <link rel="stylesheet" href="../css/telas/04-resposta-correta.css">
  </head>
  <body>
    <main class="feedback-screen">
      <section class="feedback-card" role="status" aria-live="polite">
        <div class="feedback-icon" aria-hidden="true">
          ✓
        </div>
        <h1>
          Resposta correta!
        </h1>
        <p>
          Boa! Você identificou corretamente o habitat com muita água.
        </p>
        <div class="answer-box">
          <strong>
            Sua resposta
          </strong>
          Imagem de um oceano azul com ondas suaves e peixes coloridos nadando.
        </div>
        <div class="feedback-actions">
          <button class="feedback-primary" type="button">
            Avançar →
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
