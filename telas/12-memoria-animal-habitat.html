<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>
      Creator4all Premium — Jogo da memória animal e habitat
    </title>
    <link rel="stylesheet" href="../css/telas/12-memoria-animal-habitat.css">
    <link rel="stylesheet" href="../css/chrome.css">
  </head>
  <body>
    <header class="desktop-header">
      <nav class="toolbar" aria-label="Controles da aula">
        <button class="tool" type="button">
          <span class="icon">
            <i class="fas fa-times" aria-hidden="true">
            </i>
          </span>
          <span>
            Fechar
          </span>
        </button>
        <button class="tool a11y-trigger" type="button" aria-expanded="false">
          <span class="icon">
            <i class="fas fa-universal-access" aria-hidden="true">
            </i>
          </span>
          <span>
            Acessibilidade
          </span>
        </button>
        <button class="tool sound-trigger" type="button">
          <span class="icon">
            <i class="fas fa-volume-up" aria-hidden="true">
            </i>
            <i class="fas fa-volume-mute" aria-hidden="true">
            </i>
          </span>
          <span>
            Som
          </span>
        </button>
        <button class="tool" type="button">
          <span class="icon">
            <i class="fas fa-angle-left" aria-hidden="true">
            </i>
          </span>
          <span>
            Voltar
          </span>
        </button>
        <button class="tool" type="button">
          <span class="icon">
            <i class="fas fa-angle-right" aria-hidden="true">
            </i>
          </span>
          <span>
            Avançar
          </span>
        </button>
        <div class="step">
          10 de 12
        </div>
        <div class="grow">
        </div>
        <div class="points">
          <strong>
            70
          </strong>
          <span>
            Pontos
          </span>
        </div>
      </nav>
    </header>
    <header class="mobile-header">
      <button class="mobile-action" type="button" aria-label="Fechar">
        <i class="fas fa-times" aria-hidden="true">
        </i>
      </button>
      <div class="mobile-center">
        <strong>
          Jogo da memória
        </strong>
        <span>
          10 de 12
        </span>
      </div>
      <button class="mobile-action sound-trigger" type="button" aria-label="Som">
        <i class="fas fa-volume-up" aria-hidden="true">
        </i>
        <i class="fas fa-volume-mute" aria-hidden="true">
        </i>
      </button>
      <button class="mobile-action a11y-trigger" type="button" aria-label="Acessibilidade" aria-expanded="false">
        <i class="fas fa-universal-access" aria-hidden="true">
        </i>
      </button>
    </header>
    <div class="progress">
      <span style="width:83.3%">
      </span>
    </div>
    <main class="stage">
      <article class="activity">
        <div class="fixo-top-right">
          <div id="icones-tentativas">
            <p class="msgTentativasRestantes">
              Tentativas:
              <span class="foraDaTela">
                2
              </span>
            </p>
            <span class="icon-trevo">
            </span>
            <span class="icon-trevo">
            </span>
          </div>
        </div>
        <header class="activity-header">
          <p class="prompt">
            Vamos testar sua memória! Encontre o par correto relacionando cada animal ao habitat onde ele vive.
          </p>
        </header>
        <section class="activity-body">
          <p class="helper">
            Vire duas cartas por vez. Quando encontrar um par, ele permanece aberto.
          </p>
          <div class="memory-grid">
            <button class="memory-card" type="button" data-pair="forest" aria-label="Carta da memória: Macaco">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-macaco-e107f1.jpg" alt="Macaco">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
            <button class="memory-card" type="button" data-pair="ocean" aria-label="Carta da memória: Oceano">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-oceano-60da41.jpg" alt="Oceano">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
            <button class="memory-card" type="button" data-pair="polar" aria-label="Carta da memória: Pinguim">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-pinguim-003b5a.jpg" alt="Pinguim">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
            <button class="memory-card" type="button" data-pair="forest" aria-label="Carta da memória: Floresta">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-floresta-8817dd.jpg" alt="Floresta">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
            <button class="memory-card" type="button" data-pair="ocean" aria-label="Carta da memória: Golfinho">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-golfinho-346151.jpg" alt="Golfinho">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
            <button class="memory-card" type="button" data-pair="polar" aria-label="Carta da memória: Região fria">
              <span class="card-inner">
                <span class="card-face card-back" aria-hidden="true">
                </span>
                <span class="card-face card-front">
                  <img src="../img/12-memoria-animal-habitat-regiao-fria-04f3c5.jpg" alt="Região fria">
                  <span class="match-badge" aria-hidden="true">
                  </span>
                </span>
              </span>
            </button>
          </div>
        </section>
        <footer class="activity-footer">
          <span class="status" id="status">
            0 de 3 pares encontrados
          </span>
          <button class="primary" id="confirmButton" type="button" disabled>
            Confirmar resposta
          </button>
        </footer>
      </article>
    </main>
    <div class="a11y-panel" id="a11yPanel" hidden>
      <strong>
        Acessibilidade
      </strong>
      <button id="fontButton" type="button">
        Aumentar texto
      </button>
    </div>
    <script src="../js/telas/12-memoria-animal-habitat.js"></script>
</body>
</html>
