<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>
      Creator4all — Capa Premium Refatorada

    <link rel="stylesheet" href="../css/telas/00-capa.css">

  <body>
    <main class="page">
      <section class="hero" aria-labelledby="lesson-title">
        <div class="art">
          <div class="poster-shell">
            <img class="poster" src="../img/00-capa-ilustracao-da-aula-sobre-animais-e-9c1121.jpg"
             alt="Ilustração da aula sobre animais e seus habitats">
          </div>
        </div>
        <div class="content">
          <p class="kicker">
            Aula interativa
          </p>
          <h1 id="lesson-title">
            Aula Premium Proposta de Melhorias na Interface
          </h1>
          <p class="lead">
            Explore o conteúdo e participe das atividades ao longo da aula.
          </p>
          <button class="start" id="start" type="button">
            Começar aula
          </button>
        </div>
      </section>
    </main>
    <button class="access" id="access" type="button"
 aria-label="Opções de acessibilidade" aria-expanded="false" aria-controls="panel">

        <path d="M12 2.25a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5ZM5.25 7.5a.75.75 0 0 1 .94-.49c3.79 1.19 7.83 1.19 11.62 0a.75.75 0 1 1 .45 1.43c-1.79.56-3.63.9-5.51 1.01v3.02l2.65 2.65a.75.75 0 0 1 .18.77l-1.5 4.5a.75.75 0 0 1-1.42-.48l1.35-4.05L12 13.85l-2.01 2.01 1.35 4.05a.75.75 0 0 1-1.42.48l-1.5-4.5a.75.75 0 0 1 .18-.77l2.65-2.65V9.45a20.43 20.43 0 0 1-5.51-1.01.75.75 0 0 1-.49-.94Z"/>
      </svg>
    </button>
    <div class="panel" id="panel" hidden>
      <strong>
        Acessibilidade
      </strong>
      <button id="font" type="button">
        Aumentar texto
      </button>
      <button id="contrast" type="button">
        Alto contraste
      </button>
    </div>
    <script src="../js/telas/00-capa.js"></script>
</body>
</html>
