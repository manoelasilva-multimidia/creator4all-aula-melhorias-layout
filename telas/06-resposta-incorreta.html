<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>
      Creator4all Premium — Resposta incorreta
    </title>
    <link rel="stylesheet" href="../css/telas/06-resposta-incorreta.css">
  </head>
  <body>
    <main class="feedback-screen">
      <section class="feedback-card" role="alert" aria-live="assertive">
        <div class="feedback-icon" aria-hidden="true">
          ×
        </div>
        <h1>
          Resposta incorreta
        </h1>
        <p>
          Essa opção não define habitat. Você ainda pode tentar novamente.
        </p>
        <div class="answer-box">
          <strong>
            Sua resposta
          </strong>
          O lugar onde os animais brincam.
        </div>
        <div class="feedback-actions">
          <button class="feedback-primary" type="button">
            Tentar novamente
          </button>
          <button class="feedback-secondary" type="button">
            Avançar
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
